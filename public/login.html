<!doctype html>
<html lang="pt-br" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Clean Code</title>
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="icon" type="image/x-icon" href="img/logo-mark.png" />
  </head>
  <body class="login-body">
    <div class="lado-esquerdo">
      <h1 class="login-titulo">
        SEJA BEM VINDO <br />
        NOVAMENTE!
      </h1>
      <h2 class="subtitulo">
        Faça login na sua conta ou <br />
        cadastre-se:
      </h2>
      <button class="Criar-conta">Criar conta</button>
    </div>

    <div class="lado-direito">
      <img src="img/logo-mark.png" alt="Logo Clean code" />
      <h1 class="Nomeclean">Clean Code</h1>

      <form id="loginForm">
        <input type="email" id="email" required placeholder="Email" />

        <input type="password" id="senha" required placeholder="Senha" />

        <button type="submit" class="Comece-btn-login">Entrar</button>
      </form>

      <p id="mensagemErro" class="mensagem-erro"></p>
    </div>

    <div id="logado" class="modal-container">
      <div class="modal-content">
        <p id="modal-texto"></p>
      </div>
    </div>

    <script>
      // Conectando o formulário com a API em Node

      const modal = document.getElementById("logado");
      const modalMensagem = document.getElementById("modal-texto");

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const senha = document.getElementById("senha").value;

          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, senha }),
          });

          const result = await response.json();

          modalMensagem.innerText = result.message;

          if (result.success) {
            modal.classList.add("active", "cr7");

            setTimeout(() => {
              if (result.role === "aluno") {
                window.location.href = "/aluno.html";
              } else if (result.role === "professor") {
                window.location.href = "/professor.html";
              }
            }, 3500);
          } else {
            document.getElementById("mensagemErro").innerText = result.message;
          }
        });
    </script>
  </body>
</html>
